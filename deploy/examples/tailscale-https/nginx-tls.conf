# Server-level include for nginx in the web container (mounted as
# /etc/nginx/ebook-reader.d/tls.conf, see README.md): HTTPS on the Tailscale name
# with a Let's Encrypt certificate from `tailscale cert`. HTTPS enables signing
# in, the service worker (offline reading, installing as an app) and persistent
# storage.
listen 443 ssl;
http2 on;

ssl_certificate /etc/ssl/tailscale/ebook-reader.crt;
ssl_certificate_key /etc/ssl/tailscale/ebook-reader.key;
ssl_protocols TLSv1.2 TLSv1.3;

# The Tailscale name has a valid certificate, so always use HTTPS there.
set $redirect_https "";
if ($scheme = http) {
  set $redirect_https "${host}";
}
if ($redirect_https ~ "\.ts\.net$") {
  return 301 https://$host$request_uri;
}
