# Just the reader, with no server features (no Calibre library, accounts or sync
# beyond the browser and GDrive/OneDrive): upstream's image.
# docker compose -f docker-compose.static.yml up -d
services:
  ebook-reader:
    build:
      context: ./
      dockerfile: ./apps/web/Dockerfile
    ports:
      - 9010:80
    restart: always
