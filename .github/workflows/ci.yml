name: CI
on:
  # Branches are checked through their pull request, main after each merge.
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Postinstall steps
        run: pnpm svelte-kit sync
        working-directory: apps/web

      - name: Lint
        run: pnpm eslint .

      # svelte-check isn't run: it has 13 known errors from upstream files.
      - name: Unit tests
        run: pnpm test
        working-directory: apps/web

      - name: Test build
        run: pnpm build

  python:
    name: Server scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The services image runs Debian trixie's Python 3.13.
      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Unit tests
        run: python -m unittest discover -s scripts/calibre/tests

      - name: Render the nginx config
        run: scripts/calibre/render-nginx.sh > /dev/null

  docker:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            file: docker/web.Dockerfile
          - image: services
            file: docker/services.Dockerfile
            target: base
          - image: import
            file: docker/services.Dockerfile
            target: import
          - image: difficulty
            file: docker/services.Dockerfile
            target: difficulty
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check the compose files
        run: |
          LIBRARY_PATH=/tmp docker compose --profile import --profile difficulty config --quiet
          docker compose -f docker-compose.static.yml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
