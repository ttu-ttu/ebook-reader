<!doctype html>
<html class="writing-horizontal-tb h-full w-full" lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1"
      name="viewport"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="152x152" href="%sveltekit.assets%/favicon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%sveltekit.assets%/icons/regular-icon@32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%sveltekit.assets%/icons/regular-icon@16x16.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <meta name="theme-color" content="#2d4f86" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dokusho" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="mask-icon" href="%sveltekit.assets%/safari-pinned-tab.svg" color="#2d4f86" />
    <script>
      // Dokusho: tema escolhido nas Configurações, antes de desenhar (lib/data/tema.ts).
      try {
        var tema = localStorage.getItem('dokusho-tema');
        if (tema === 'claro' || tema === 'escuro') document.documentElement.dataset.tema = tema;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body class="h-full w-full break-words font-sans">
    <div class="h-full w-full">%sveltekit.body%</div>
  </body>
</html>
